# rosdep keys that the ROS distribution's rosdep database lacks.
# Registered once per PC (docs/environment-setup.md of robot-programming):
#   echo "yaml file://$HOME/ros2_ws/src/jedy/rosdep.yaml" | \
#     sudo tee /etc/ros/rosdep/sources.list.d/50-jedy.list
#   rosdep update
#
# fonts-noto-cjk: the Japanese font of jedy_speech's speech bubbles. The
# database has only fonts-noto, which also pulls in every other Noto font
# (325 MB to download on Ubuntu 24.04, against 61 MB for this one).
fonts-noto-cjk:
  ubuntu: [fonts-noto-cjk]
  debian: [fonts-noto-cjk]
