/jedy:
  controller_manager:
    ros__parameters:
      update_rate: 100  # Hz

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      jedy_arm_controller:
        type: joint_trajectory_controller/JointTrajectoryController

      jedy_velocity_controller:
        type: velocity_controllers/JointGroupVelocityController

      jedy_effort_controller:
        type: effort_controllers/JointGroupEffortController

  jedy_arm_controller:
    ros__parameters:
      joints:
        - rarm_joint0
        - rarm_joint1
        - rarm_joint2
        - rarm_joint3
        - rarm_joint4
        - rarm_joint5
        - rarm_joint6
        - larm_joint0
        - larm_joint1
        - larm_joint2
        - larm_joint3
        - larm_joint4
        - larm_joint5
        - larm_joint6
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity
      allow_nonzero_velocity_at_trajectory_end: true
      # accept goals that specify a subset of joints; the rest hold their current
      # (reset) command thanks to the actuo_hardware initial_value seeding.
      allow_partial_joints_goal: true

  jedy_velocity_controller:
    ros__parameters:
      joints:
        - rarm_joint0
        - rarm_joint1
        - rarm_joint2
        - rarm_joint3
        - rarm_joint4
        - rarm_joint5
        - rarm_joint6
        - larm_joint0
        - larm_joint1
        - larm_joint2
        - larm_joint3
        - larm_joint4
        - larm_joint5
        - larm_joint6
      interface_name: velocity

  jedy_effort_controller:
    ros__parameters:
      joints:
        - rarm_joint0
        - rarm_joint1
        - rarm_joint2
        - rarm_joint3
        - rarm_joint4
        - rarm_joint5
        - rarm_joint6
        - larm_joint0
        - larm_joint1
        - larm_joint2
        - larm_joint3
        - larm_joint4
        - larm_joint5
        - larm_joint6
      interface_name: effort
