# offset_deg values come from rcb4 'offset' (degrees in that stack).
# Joint order below follows URDF <ros2_control> joint order; this order is the ros2_control/shm contract.
# position_limit_deg comes from URDF <joint><limit lower/upper> (radians->degrees), not from servo mechanical stops.
#
# CONFIRMED ON THE BOARD 2026-08-03, firmware v0.6.5, by
# 'actuo-kondo-probe --scan': all 22 servos this file names reported flag=1 with
# zero timeout_count, zero rxerror_count, and zero checksum/framing errors on
# the transport. Re-running the importer with --present-ids for exactly that set
# commented nothing out and changed none of the 18 position entries below, which
# is why this file was kept rather than regenerated.
#
# That is a DIFFERENT robot from the one jedy_four_dof_kondo.yaml was imported
# against on 2026-08-01, whose scan saw only 0-6, 20-23, 32 and 34. Ids 7-15 --
# most of the left arm, and both grippers -- are present here and were not
# there. Do not carry that file's "servo not on the bus" notes over to this one.

bus:
  plugin: kondo_h7_bus
  symbols: package://actuo_ros/config/kondoh7_v0.6.5_symbols.yaml
  # Board-side interpolation per command (rcb4 calls the raw byte
  # `frame_count`; ms = byte * 10). Each packet RESTARTS the board's
  # interpolation, so a duration far above the cycle time means the joint never
  # reaches a setpoint before the next packet arrives.
  #
  # MEASURED ON THIS CONFIGURATION, 2026-08-03, by a move-time sweep against
  # head_joint0 through a 25 deg swing at 100 Hz, scored off the controller's
  # own reference-vs-feedback:
  #
  #     ms  byte  lag_rms  lag_max  speed_err  stalled  settle   (deg, %, deg)
  #     10    1     0.44     3.26     20.8      0.0      0.04
  #     20    2     0.50     3.20     22.5      0.0      0.05    <- this
  #     30    3     0.53     3.15     18.2      0.1      0.05
  #     50    5     0.67     3.44     23.7      0.1      0.06
  #     70    7     0.74     1.04     18.0      0.2      0.06
  #    100   10     0.96     3.76     26.3      1.0      0.09
  #    400   40     2.61     5.54     32.7      3.5      0.47
  #   1270  127     6.35     9.88     47.5      9.7      3.56  (actuator default)
  #
  # Lag and settle grow monotonically with the duration, so the shortest value
  # that still looks smooth is the one to keep.
  #
  # 20 and not 10, which measured tighter: 10 ms is exactly one control period,
  # so a cycle that runs late leaves the servo finished and waiting, which is
  # the stepping the number exists to avoid. Two periods buys that margin for
  # 0.06 deg of lag.
  #
  # It agrees with the value jedy_four_dof_kondo.yaml measured independently on
  # 9 joints. That is worth stating because it was the open question when this
  # file was first written: this configuration puts 18 position joints in a
  # packet where the sibling put 9, and the round trip could have moved the
  # answer. It did not.
  #
  #   (the sweep tool, tune_move_time, was not carried over to actuo; the
  #   method: a 25 deg head_joint0 swing per value 10 20 30 40 50 70)
  move_time_ms: 20.0
  transport:
    plugin: kondo_h7
    # A udev symlink, never /dev/ttyUSB0 and no longer a by-id path either.
    # The number moves -- three times in one afternoon -- and a by-id path
    # names one physical chip, so a config carrying it works on exactly one
    # computer (a by-id path cost a workshop laptop an afternoon, 2026-08-04).
    # /dev/actuo_kondo_armh7 is created by 99-actuo-kondo-symlink.rules; a machine that
    # has not run the installer has no such file:
    #
    #   sudo $(ros2 pkg prefix actuo_ros)/share/actuo_ros/udev/install.sh
    #
    # SET AND VERIFIED 2026-08-03: the adapter this resolved to answered a
    # version request on the first attempt (firmware v0.6.5). It was the
    # same FTDI adapter jedy_four_dof_kondo.yaml points at -- the two
    # configs address the same physical bus, which is the reason the wheel
    # calibration copied further down is worth inheriting at all.
    channel: /dev/actuo_kondo_armh7
    bitrate: 1000000

