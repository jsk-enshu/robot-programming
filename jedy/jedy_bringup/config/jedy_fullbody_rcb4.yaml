  # --- the mecanum base ------------------------------------------------------
  #
  # ADDED BY HAND, below the eighteen the importer wrote, and they belong here
  # rather than in its output: the importer refuses to emit a `type: continuous`
  # servo, because it only knows how to write kondo_ics and that plugin is
  # POSITION-only. These four are the same servos with ServoStruct.rotation set,
  # which makes the board read their command field as a SPEED rather than a
  # target pulse. They ride in the same packet as the arm joints; only the
  # actuator model differs, and the bus refuses to start if the board disagrees
  # with the plugin named here.
  #
  # Their position in this list is NOT free. It has to match the tail of the
  # <ros2_control> block in jedy_fullbody_actuo.urdf.xacro expanded with
  # wheels:=true, because actuo_hardware maps the two by index: front right,
  # front left, rear right, rear left, after the two grippers. If the importer
  # is ever re-run, re-append this block in the same place.
  #
  # WHICH CORNER: derived from the URDF, not read off the names. Mapping the
  # wheel origins through pseudo_base_joint puts each joint at the corner its
  # name claims (see jedy_fullbody_controllers.yaml for the table). That is a
  # finding rather than an assumption.
  #
  # DIRECTION: taken from the legacy servo map (jedy_servo_config.yaml). All
  # four <axis> in jedy_gz.xacro are "1. 0. 0.", which maps to [0, 1, 0] in
  # base_link: four parallel, identically signed spin axes. No wheel axis is
  # flipped, so no sign needs compensating and the map's own signs stand.
  #
  #   ==> NOT YET VERIFIED ON HARDWARE. Turn each wheel by hand and watch the
  #       model before driving. A wrong sign on a mecanum base is not a slower
  #       robot: it strafes when told to drive forward, at full speed, with
  #       every wheel doing exactly what it was asked.
  #
  # deadband_deg / saturate_deg / rev_s_per_command_deg: a QUICK CHECK on this
  # robot's RCB-4mini (2026-11-12, 7.4 V supply, wheels lifted), not a full
  # actuo-wheel-calibrate run. Forward speed, median over 3 s at ~74 Hz:
  #
  #   servo     5 deg       10 deg      20 deg     [rev/s]
  #     20      0.511       0.966       1.539
  #     21      0.515       0.966       1.573
  #     22      0.509       0.970       1.513
  #     23      0.522       0.972       1.534
  #
  # So about 0.1 rev/s per deg up to 10 deg, sub-linear by 20 deg. The values
  # below claim only what was measured: rev_s_per_command_deg is the mean of the
  # 5 and 10 deg slopes; deadband_deg is 5 because that is the smallest offset
  # tried (all four turned there; below it is unmeasured, so it is commanded as
  # a stop); saturate_deg is 10, the top of the range where the line fits, which
  # caps the base at ~0.98 rev/s (~0.156 m/s on the 25.25 mm wheels). The ARM-H7
  # map copied here before (9 deg deadband, 0.053-0.072 rev/s per deg) was
  # 1.4-1.9x slow for this robot. For the full map:
  #
  #   ros2 run actuo_ros actuo-wheel-calibrate --board rcb4mini \
  #       --channel /dev/actuo_kondo_rcb4mini --ids 20 21 22 23 --rotation-checked ...
  #
  - name: front_right_wheel_joint
    actuator:
      plugin: kondo_ics_wheel
      id: 20
      # Seen in rotation mode on this robot's RCB-4mini: reference set to stop
      # (7500), then +300 pulses for 1.5 s turned it continuously (the pot
      # wrapped twice); a position servo would have stopped at 7800.
      rotation_checked: "2026-11-12, +300 pulse command on the RCB-4mini turned it continuously (pot wrapped twice in 1.5 s)"
      direction: 1
      deadband_deg: 5.0
      saturate_deg: 10.0
      rev_s_per_command_deg: 0.0985
  - name: front_left_wheel_joint
    actuator:
      plugin: kondo_ics_wheel
      id: 21
      # Seen in rotation mode on this robot's RCB-4mini: reference set to stop
      # (7500), then +300 pulses for 1.5 s turned it continuously (the pot
      # wrapped twice); a position servo would have stopped at 7800.
      rotation_checked: "2026-11-12, +300 pulse command on the RCB-4mini turned it continuously (pot wrapped twice in 1.5 s)"
      direction: -1
      deadband_deg: 5.0
      saturate_deg: 10.0
      rev_s_per_command_deg: 0.0985
  - name: rear_right_wheel_joint
    actuator:
      plugin: kondo_ics_wheel
      id: 22
      # Seen in rotation mode on this robot's RCB-4mini: reference set to stop
      # (7500), then +300 pulses for 1.5 s turned it continuously (the pot
      # wrapped twice); a position servo would have stopped at 7800.
      rotation_checked: "2026-11-12, +300 pulse command on the RCB-4mini turned it continuously (pot wrapped twice in 1.5 s)"
      direction: 1
      deadband_deg: 5.0
      saturate_deg: 10.0
      rev_s_per_command_deg: 0.0994
  - name: rear_left_wheel_joint
    actuator:
      plugin: kondo_ics_wheel
      id: 23
      # Seen in rotation mode on this robot's RCB-4mini: reference set to stop
      # (7500), then +300 pulses for 1.5 s turned it continuously (the pot
      # wrapped twice); a position servo would have stopped at 7800.
      rotation_checked: "2026-11-12, +300 pulse command on the RCB-4mini turned it continuously (pot wrapped twice in 1.5 s)"
      direction: -1
      deadband_deg: 5.0
      saturate_deg: 10.0
      rev_s_per_command_deg: 0.1008
