  - name: larm_joint1
    actuator:
      plugin: kondo_ics
      id: 3
      velocity: 1       # UNVERIFIED move byte; see the header
      direction: 1
      offset_deg: 0.0
      position_limit_deg: [-32.085637, 134.645082]
  - name: larm_joint2
    actuator:
      plugin: kondo_ics
      id: 5
      velocity: 1       # UNVERIFIED move byte; see the header
      direction: 1
      offset_deg: 0.0
      position_limit_deg: [-134.645082, 134.645082]
  - name: larm_joint3
    actuator:
      plugin: kondo_ics
