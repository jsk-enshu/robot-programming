# Jedy's whole body on the Kondo RCB-4mini: 22 joints, in the order
# jedy_fullbody_actuo.urdf.xacro and the controllers expect (the shm layout).
#
#   ros2 launch jedy_bringup jedy_fullbody_all.launch.py
#
# Derived on 2026-10-26, WITHOUT A BOARD, from the config of the ARM-H7 board
# Jedy used before (removed 2026-11-13). Every value below that the H7 config
# did not already carry is marked UNVERIFIED and listed in HUMAN_CHECKLIST.md.
# What changed from the H7 and why:
#
# * bus/transport: kondo_rcb4_bus over kondo_rcb4 (even parity, 1.25 Mbit/s,
#   switched to from the board's power-up 115200 by the bus itself).
# * ids: the H7 numbers are kept. On the RCB-4mini a servo answers on ICS
#   number 2 x ID + port (port 0 = SIO1-4, 1 = SIO5-8), the same even/odd split
#   the H7's two port groups give, so these numbers hold IF the right arm and
#   head are on SIO1-4 and the left arm on SIO5-8 with the same IDs as on the
#   H7. UNVERIFIED: run actuo-kondo-rcb4-probe and compare.
# * velocity: the RCB-4mini's move-duration unit has not been measured
#   (kondo_rcb4_bus.FRAME_SCALE_MS is None), so move_time_ms is refused and each
#   servo carries a move byte instead. The board takes ONE move byte for every
#   servo in the 0x10 packet and a wheel's is always 1, so every joint is 1:
#   one output cycle, 15 ms on a flat board. UNVERIFIED for smoothness.
# * wheels: need `rotation_checked` (see the comment on each); until it is
#   filled in the servicer refuses to start with this config. That is the
#   safety check working, not a bug: a position servo driven as a wheel swings
#   to wherever the speed command points.

bus:
  plugin: kondo_rcb4_bus
  state_slots: [current_angle]
  ics_bitrate: 1250000   # UNVERIFIED: what the servos are set to
  transport:
    plugin: kondo_rcb4
    # The udev symlink for the Kondo DUAL USB ADAPTER HS (165c:0008), from
    # actuo_ros' 99-actuo-kondo-symlink.rules:
    #   sudo $(ros2 pkg prefix actuo_ros)/share/actuo_ros/udev/install.sh
    channel: /dev/actuo_kondo_rcb4mini
    bitrate: 1250000

joints:
  - name: head_joint0
    actuator:
      plugin: kondo_ics
      id: 32
      velocity: 1       # UNVERIFIED move byte; see the header
      direction: -1
      offset_deg: 0.0
      position_limit_deg: [-134.645082, 134.645082]
