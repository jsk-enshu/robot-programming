bus:
  plugin: kondo_h7_bus
  # package:// because this config no longer lives beside the symbol map:
  # the map describes the BOARD FIRMWARE build and is shared by every Kondo
  # robot, so it lives in actuo_ros with one copy rather than one per robot.
  symbols: package://actuo_ros/config/kondoh7_v0.6.5_symbols.yaml
  # board-side interpolation time (KondoH7Bus.move_time_ms). Start at one control
  # period (100 Hz => 10 ms): shorter can lurch/stop between packets, longer may
  # never settle to each target before the next packet. This value is NOT yet
  # validated on hardware.
  move_time_ms: 10.0
  transport:
    plugin: kondo_h7
    channel: "__SET_REAL_DEVICE_PATH__"  # operator must set the real serial device path
    bitrate: 1000000

