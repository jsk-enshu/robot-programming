; Mechatrobot driver for Arduino UNO R4 WiFi that talks plain text over USB
; serial. mechatrobot_ros2/scripts/serial_bridge.py turns it into ROS 2 topics.
;
;   pio run -e mechatrobot_serial -t upload

[env:mechatrobot_serial]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
lib_deps =
    arduino-libraries/Servo@^1.2.2
