; micro-ROS on Arduino UNO R4 WiFi over USB serial (no WiFi).
;
; Each env builds its own libmicroros with only as many publishers/subscribers
; as its sketch uses (see metas/), which is what makes it fit in 32 KB of SRAM.
;
;   pio run -e pubsub_sample -t upload
;   pio run -e mechatrobot   -t upload

[platformio]
default_envs = pubsub_sample

[env]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio.git#cfee17faffaa532363b7151dd13af6a85c69d3c1
board_microros_distro = jazzy
board_microros_transport = serial
; Strip a sourced /opt/ros/* from the environment before micro-ROS is cross-built.
extra_scripts = pre:scripts/strip_ros_env.py
; The Renesas core's Serial.h defines _TIMEVAL_DEFINED, which hides struct timeval
; from micro_ros_platformio's sources that include <sys/time.h> after <Arduino.h>.
; Pre-including it fixes that. Keep it one token: micro_ros_platformio joins
; CCFLAGS as strings and a two-word "-include sys/time.h" breaks its build script.
build_flags = -includesys/time.h

[env:pubsub_sample]
build_src_filter = +<pubsub_sample.cpp>
board_microros_user_meta = metas/pubsub_sample.meta

[env:mechatrobot]
build_src_filter = +<mechatrobot_driver.cpp>
board_microros_user_meta = metas/mechatrobot.meta
lib_deps =
    ${env.lib_deps}
    arduino-libraries/Stepper@^1.1.3
